<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>🕷️ My Movie Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>
      <img src="https://img.icons8.com/color/96/spider-man-head.png" alt="Spider-Man Logo" style="vertical-align: middle; margin-right: 10px; width: 45px; margin-bottom: 5px;"> 
      My Watchlist & Vault
    </h1>
    <p style="max-width: 650px; margin: 0 auto; line-height: 1.6; color: #94a3b8;">
      Hey fellow cinephiles! This is Shreerag, and these are some of the real masterclass movies and series which I've watched to date. Highly recommended! 🕸️
    </p>
  </header>

  <!-- Category Routing Tabs -->
  <div class="category-tabs" id="category-tabs">
    <button class="tab-btn active" data-category="all">All Entries</button>
    <button class="tab-btn" data-category="hollywood">Hollywood</button>
    <button class="tab-btn" data-category="indian">Indian Cinema</button>
    <button class="tab-btn" data-category="anime">Anime</button>
  </div>

  <div class="controls-container">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="🔍 Search movies, shows, or reviews..." />
    </div>
    
    <div class="filter-sort-group">
      <select id="language-filter">
        <option value="all">🌐 All Languages</option>
      </select>
      <select id="genre-filter">
        <option value="all">🎭 All Genres</option>
      </select>
      <select id="sort-select">
        <option value="az">🔤 Title (A to Z)</option>
        <option value="za">🔤 Title (Z to A)</option>
        <option value="newest">📅 Year (Newest First)</option>
        <option value="oldest">📅 Year (Oldest First)</option>
      </select>
      <!-- Layout Toggle Button -->
      <button id="layout-toggle" class="layout-toggle">📄 List View</button>
    </div>
  </div>

  <main class="container">
    <section id="section-favorites">
      <h2>⭐ All-Time Favorites</h2>
      <div id="all-time-favorites" class="card-grid"></div>
    </section>

    <section id="section-movies">
      <h2>🎞️ All Movies Watched</h2>
      <div id="all-movies" class="card-grid"></div>
    </section>

    <section id="section-series">
      <h2>📺 Web Series Watched</h2>
      <div id="web-series" class="card-grid"></div>
    </section>
  </main>

  <script>
    const OMDB_API_KEY = "9402d628";
    const TMDB_KEY = "15d2ea6d0dc1d476efbca3eba2b9bbfb";
    let allData = [];
    let currentCategory = 'all';
    let isListView = false;

    function extractYear(item) {
      if (typeof item.year === 'number') return item.year;
      const match = String(item.year).match(/\d{4}/);
      return match ? parseInt(match[0], 10) : 0;
    }

    async function fetchPoster(title, year) {
      const cleanTitle = title.toLowerCase().trim();
      const cacheKey = `vault_poster_${cleanTitle}`;
      const cached = localStorage.getItem(cacheKey);
      if (cached) return cached;

      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}`);
        const data = await res.json();
        if (data && data.results && data.results.length > 0) {
          const match = data.results.find(r => r.poster_path) || data.results[0];
          if (match && match.poster_path) {
            const posterUrl = `https://image.tmdb.org/t/p/w500${match.poster_path}`;
            localStorage.setItem(cacheKey, posterUrl);
            return posterUrl;
          }
        }
      } catch (err) {}

      try {
        const cleanYear = extractYear({ year });
        let omdbUrl = `https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${OMDB_API_KEY}`;
        if (cleanYear > 0) omdbUrl += `&y=${cleanYear}`;
        const res = await fetch(omdbUrl);
        const data = await res.json();
        if (data.Response === "True" && data.Poster && data.Poster !== "N/A") {
          const securePoster = data.Poster.replace(/^http:\/\//i, 'https://');
          localStorage.setItem(cacheKey, securePoster);
          return securePoster;
        }
      } catch (err) {}
      return null;
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'movie-card';

      // --- NEW: Make the card clickable for Google Search ---
      card.style.cursor = 'pointer'; 
      card.title = `Click to search for ${item.title}`; 
      card.addEventListener('click', () => {
        const searchTerms = `${item.title} ${item.year ? item.year : ''} ${item.type === 'series' ? 'tv series' : 'movie'}`;
        const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(searchTerms)}`;
        window.open(googleUrl, '_blank'); 
      });
      // --------------------------------------------------------

      const infoLine = item.seasons 
        ? `<p><strong>Seasons:</strong> ${item.seasons} (${item.year})</p>`
        : `<p><strong>Year:</strong> ${item.year}</p>`;

      const defaultIcon = item.type === 'series' ? '📺' : '🎬';

      card.innerHTML = `
        <div class="card-banner">
          <div class="banner-fallback">${defaultIcon}</div>
          <span class="lang-badge">${item.language || 'English'}</span>
        </div>
        <div class="card-body">
          <h3>${item.title}</h3>
          ${infoLine}
          <p class="rating-text"><strong>Rating:</strong> ${item.rating}</p>
          <span class="genre-badge">${item.genre}</span>
        </div>
      `;

      fetchPoster(item.title, item.year).then(url => {
        if (url) {
          const banner = card.querySelector('.card-banner');
          const fallback = card.querySelector('.banner-fallback');
          if (banner) {
            banner.style.backgroundImage = `url('${url}')`;
            banner.style.backgroundSize = 'cover';
            banner.style.backgroundPosition = 'center';
            if (fallback) fallback.style.display = 'none';
          }
        }
      });
      return card;
    }

    function populateDropdowns(items) {
      const genreSelect = document.getElementById('genre-filter');
      const langSelect = document.getElementById('language-filter');
      const genres = new Set();
      const languages = new Set();

      items.forEach(item => {
        languages.add(item.language || 'English');
        if (item.genre) {
          item.genre.split('/').forEach(g => genres.add(g.trim()));
        }
      });

      langSelect.innerHTML = '<option value="all">🌐 All Languages</option>';
      genreSelect.innerHTML = '<option value="all">🎭 All Genres</option>';

      Array.from(languages).sort().forEach(lang => {
        const opt = document.createElement('option');
        opt.value = lang.toLowerCase();
        opt.textContent = lang;
        langSelect.appendChild(opt);
      });

      Array.from(genres).sort().forEach(genre => {
        const opt = document.createElement('option');
        opt.value = genre.toLowerCase();
        opt.textContent = genre;
        genreSelect.appendChild(opt);
      });
    }

    function renderList(targetId, list) {
      const container = document.getElementById(targetId);
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = `<p style="padding: 1rem; color: #94a3b8; font-style: italic;">No entries found.</p>`;
        return;
      }
      list.forEach(item => container.appendChild(createCard(item)));
    }

    function applyFilters() {
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const selectedGenre = document.getElementById('genre-filter').value;
      const selectedLang = document.getElementById('language-filter').value;
      const sortMode = document.getElementById('sort-select').value;

      let filtered = allData.filter(item => {
        const itemLang = (item.language || 'English').toLowerCase();
        
        // Category Routing Logic
        let matchesCategory = true;
        if (currentCategory === 'hollywood') {
          matchesCategory = itemLang === 'english';
        } else if (currentCategory === 'indian') {
          matchesCategory = ['hindi', 'kannada', 'telugu', 'tamil', 'malayalam'].includes(itemLang);
        } else if (currentCategory === 'anime') {
          matchesCategory = itemLang === 'japanese';
        }

        const matchesSearch = 
          item.title.toLowerCase().includes(searchQuery) ||
          (item.genre && item.genre.toLowerCase().includes(searchQuery)) ||
          itemLang.includes(searchQuery);

        const matchesGenre = (selectedGenre === 'all') || 
          (item.genre && item.genre.toLowerCase().includes(selectedGenre));

        const matchesLang = (selectedLang === 'all') || (itemLang === selectedLang);

        return matchesSearch && matchesGenre && matchesLang && matchesCategory;
      });

      filtered.sort((a, b) => {
        if (sortMode === 'az') return a.title.localeCompare(b.title);
        if (sortMode === 'za') return b.title.localeCompare(a.title);
        if (sortMode === 'newest') return extractYear(b) - extractYear(a);
        if (sortMode === 'oldest') return extractYear(a) - extractYear(b);
        return 0;
      });

      renderList('all-time-favorites', filtered.filter(item => item.favorite));
      renderList('all-movies', filtered.filter(item => item.type === 'movie'));
      renderList('web-series', filtered.filter(item => item.type === 'series'));
    }

    // Tab Click Event
    document.getElementById('category-tabs').addEventListener('click', (e) => {
      if(e.target.classList.contains('tab-btn')) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.getAttribute('data-category');
        applyFilters();
      }
    });

    // Layout Toggle Event
    document.getElementById('layout-toggle').addEventListener('click', (e) => {
      isListView = !isListView;
      e.target.innerText = isListView ? '🖼️ Grid View' : '📄 List View';
      
      const grids = document.querySelectorAll('.card-grid');
      grids.forEach(grid => {
        if (isListView) {
          grid.classList.add('list-view');
        } else {
          grid.classList.remove('list-view');
        }
      });
    });

    fetch('movies.json')
      .then(res => res.json())
      .then(data => {
        // The Duplicate Catcher
        const seen = new Set();
        allData = data.filter(item => {
          const key = `${item.title.toLowerCase().trim()}-${item.year}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });

        populateDropdowns(allData);
        applyFilters();

        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('language-filter').addEventListener('change', applyFilters);
        document.getElementById('genre-filter').addEventListener('change', applyFilters);
        document.getElementById('sort-select').addEventListener('change', applyFilters);
      });
  </script>
</body>
</html>
