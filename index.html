<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 My Watchlist & Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🎬 My Watchlist & Vault</h1>
    <p>A personal archive of every movie and web series I've loved and experienced.</p>
  </header>

  <main class="container">
    <!-- 1. All-Time Favorites -->
    <section>
      <h2>⭐ All-Time Favorites</h2>
      <div id="all-time-favorites" class="card-grid"></div>
    </section>

    <!-- 2. All Movies Watched (Sorted Alphabetically A-Z) -->
    <section>
      <h2>🎞️ All Movies Watched</h2>
      <div id="all-movies" class="card-grid"></div>
    </section>

    <!-- 3. Web Series Watched -->
    <section>
      <h2>📺 Web Series Watched</h2>
      <div id="web-series" class="card-grid"></div>
    </section>
  </main>

  <footer>
    <p>Made with 🍿 & Cinema</p>
    <p>© 2026 My Watchlist</p>
  </footer>

  <script>
    // Helper function to build each card element
    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'movie-card';

      const infoLine = item.seasons 
        ? `<p><strong>Seasons:</strong> ${item.seasons} (${item.year})</p>`
        : `<p><strong>Year:</strong> ${item.year}</p>`;

      card.innerHTML = `
        <div class="card-icon">${item.type === 'series' ? '📺' : '🎬'}</div>
        <h3>${item.title}</h3>
        ${infoLine}
        <p><strong>Rating:</strong> ${item.rating}</p>
        <span class="genre-badge">${item.genre}</span>
        ${item.review ? `<p class="review">"${item.review}"</p>` : ''}
      `;
      return card;
    }

    fetch('movies.json')
      .then(response => response.json())
      .then(items => {
        // 1. Render Favorites (preserves your custom list order)
        const favGrid = document.getElementById('all-time-favorites');
        items.filter(item => item.favorite).forEach(item => {
          favGrid.appendChild(createCard(item));
        });

        // 2. Render All Movies Watched (Automatically sorted A to Z by title)
        const moviesGrid = document.getElementById('all-movies');
        const moviesList = items.filter(item => item.type === 'movie');
        moviesList.sort((a, b) => a.title.localeCompare(b.title));
        moviesList.forEach(movie => {
          moviesGrid.appendChild(createCard(movie));
        });

        // 3. Render Web Series Watched
        const seriesGrid = document.getElementById('web-series');
        items.filter(item => item.type === 'series').forEach(series => {
          seriesGrid.appendChild(createCard(series));
        });
      })
      .catch(err => console.error("Error loading watchlist data:", err));
  </script>
</body>
</html>
